server:
  port: 8080

spring:
  application:
    name: finstream-backend

  # Enable Java 21 Project Loom Virtual Threads for high-throughput Tomcat I/O
  threads:
    virtual:
      enabled: true

  # Database Configuration (MySQL 8)
  datasource:
    url: jdbc:mysql://localhost:3306/finstream_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: FinStreamHikariCP

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway handles schema creation
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Flyway Schema Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all # Guarantees strong durability in banking
      retries: 3
    consumer:
      group-id: finstream-settlement-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.banking.finstream.*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
